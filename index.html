<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <base href="/gym/" />
        <link rel="icon" type="image/png" href="/gym/assets/logo-BtjcDrXI.png?v=2" />
        <link rel="shortcut icon" type="image/png" href="/gym/assets/logo-BtjcDrXI.png?v=2" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Enable full-screen standalone PWA mode -->
        <meta name="mobile-web-app-capable" content="yes">
        <!-- Status bar style: can be default / black / black-translucent -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <!-- Background color behind the status bar -->
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#242424" />
        <title>GymTracker - Track Workouts, Exercises & Personal Bests</title>
        <meta name="description" content="Free fitness and workout tracking app. Track exercises, workouts, and personal bests. Start your fitness journey today!" />
        <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/gym/apple-splash-1125x2436.png" />
        <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/gym/apple-splash-1170x2532.png" />
        <link rel="apple-touch-icon" href="/gym/pwa-192x192.png" />
      <script type="module" crossorigin src="/gym/assets/index-VdMWWa-G.js"></script>
      <link rel="stylesheet" crossorigin href="/gym/assets/index-wQvwXKOF.css">
    <link rel="manifest" href="/gym/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/gym/registerSW.js"></script></head>

    <style>
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hide splash screen on desktop (screens >= 768px) */
        @media (min-width: 768px) {
            #splash-screen {
                display: none !important;
            }
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        #splash-screen img {
            width: 180px;
            height: 180px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .splash-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            text-align: center;
            font-weight: 600;
            font-size: 1.5rem;
            color: #333;
            letter-spacing: 0.03em;
            margin: 0;
            line-height: 1.2;
        }

        .splash-text .bigger {
            display: block;
            font-size: 2.4rem;
            font-weight: 700;
            margin-top: 0.2rem;
            color: #1a202c;
            /* Slightly darker */
            letter-spacing: 0.05em;
        }

        #splash-screen.fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
    </style>

    <body>
        <script>
            const theme = localStorage.getItem("theme");
            if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.documentElement.classList.add("dark");
            }
        </script>
        <div id="splash-screen">
            <div class="splash-content">
                <img src="/gym/pwa-192x192.png" alt="logo" />
                <p class="splash-text">
                    Dream Big<br />
                    <span class="bigger">Do Bigger</span>
                </p>
            </div>
        </div>
        <div id="root"></div>
    </body>
</html>
